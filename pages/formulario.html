<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form id="formulario">
        <h1> Formulario de ingreso </h1>
    <div>
        <label for="nombre">Escribe tu nombre:</label>
    <input type="text" id="nombre" name="nombre">
    </div>
    <div>
        <label for="edad">¿Cuántos años tienes?</label>
    <input type="number" id="edad" name="edad">
    </div>
    <div>
        <label>Pasamientos:</label><br>
        <input type="radio" id="deportes" name="pasatiempo" value="deporte">
        <label for="deporte">Deportes</label>
    </div>
    <div>
    <input type="radio" id="musica" name="pasatiempo" value="musica">
        <label for="musica">Música</label>
    </div>
    <div>
        <input type="radio" id="dibujo" name="pasatiempo" value="dibujo">
        <label for="dibujo">Dibujo</label>
    </div>
    <div>
        <button type="button"
        onclick="saludar()">Enviar</button>
    </div>
    </form>
</body>
</html>
